version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    restart: always
    environment:
      POSTGRES_USER: climate_user
      POSTGRES_PASSWORD: climate_password
      POSTGRES_DB: climate_platform
    ports:
      - "5432:5432"
    volumes:
      - postgis_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climate_user -d climate_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg://climate_user:climate_password@db:5432/climate_platform
      - CHROMA_PERSIST_DIR=knowledge_base/chroma
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgis_prod_data:
