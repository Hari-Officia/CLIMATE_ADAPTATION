name: Enterprise CI/CD Pipeline - Phase Q Governance

on:
  push:
    branches: [ main, master, staging ]
  pull_request:
    branches: [ main, master ]

jobs:
  static-analysis:
    name: 1. Static Analysis & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run Secret Scanner
        run: python scripts/scan_secrets.py

  backend-test:
    name: 2. Pytest Automated Regression Suite
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Execute Pytest Regression Suite
        run: |
          python -m pytest tests/

  frontend-build:
    name: 3. Frontend React Vite Build & Lint
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & Build
        run: |
          cd frontend
          npm ci
          npm run build

  38-district-validation:
    name: 4. 38-District Decision Audit Gate
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
      - name: Run 38-District UI Audit
        env:
          PYTHONPATH: .
        run: python scripts/run_phase_p_38_district_ui.py
